# The dashboard: the server's services, their logs, files and git, and the server itself.
# A clone of the repository, updated by its own Update or `bun run deploy`.
services:
  # The database brought up to the schema, before the dashboard starts on it, each
  # time it's started: by Update or `bun run deploy` alike. A migration that
  # fails leaves the dashboard that's running as it is. From the Dockerfile's
  # stage of Prisma and the migrations alone; the dashboard doesn't list it.
  migrate:
    build:
      context: .
      target: migrate
    env_file: .env
    restart: 'no'
    labels:
      dash.purpose: the database's migrations, before the dashboard starts
    networks:
      - caddy

  dash:
    build:
      context: .
      args:
        NEXT_PUBLIC_SERVER_NAME: vps.niso.moe
    container_name: dash
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Its secrets: the sign-in secret, the database and the image storage's keys.
    # Only on the server, never in the repository.
    env_file: .env
    environment:
      BETTER_AUTH_URL: https://dash.niso.moe
      DOCKER_HOST: unix:///var/run/docker.sock
      STACKS_ROOT: /home/nikki
      STORAGE_API_URL: https://s3.niso.moe
      STORAGE_PUBLIC_URL: https://images.niso.moe/dash
    # Sees the server's processes and its network, for the server's stats and
    # its process list, rather than only its own
    pid: host
    # And which container each runs in, its own included, which a container
    # otherwise only sees for the others
    cgroup: host
    volumes:
      # Docker, to list, run and look into the services
      - /var/run/docker.sock:/var/run/docker.sock
      # The services' folders, at the same path as on the server, for their files
      - /home/nikki:/home/nikki
    networks:
      - caddy
      - arr-stack

networks:
  # Behind Caddy, which serves it at dash.niso.moe
  caddy:
    external: true
  # Beside Sonarr, Jellyfin and the rest, to read their numbers for their tiles
  arr-stack:
    name: arr-stack_default
    external: true
